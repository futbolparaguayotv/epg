name: Actualizar EPG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar EPG
        run: python epg/build_epg.py
      - name: Guardar cambios
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg/epg.json
          if git diff --cached --quiet; then
            echo "No hay cambios en el EPG"
            exit 0
          fi
          git commit -m "Actualizar EPG"
          for intento in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "EPG actualizado correctamente"
              exit 0
            fi
            if [ -d "$(git rev-parse --git-path rebase-merge)" ] || \
               [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
              git rebase --abort
              echo "Conflicto al integrar cambios"
              exit 1
            fi
            sleep 5
          done
          echo "No se pudo subir el EPG"
          exit 1
