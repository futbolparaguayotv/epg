name: Actualizar EPG
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar EPG XMLTV
        run: python epg/build_epg.py
      - name: Añadir EPG Claro (sin borrar otros canales)
        env:
          CLARO_EPG_SOURCE_URL: ${{ secrets.CLARO_EPG_SOURCE_URL }}
        run: |
          if [ -n "$CLARO_EPG_SOURCE_URL" ]; then
            python epg/update_claro.py || echo "Claro no disponible: se conserva EPG anterior"
          else
            echo "Sin fuente Claro configurada: se conserva EPG actual"
          fi
      - name: Publicar cambios
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg/epg.json
          git diff --staged --quiet || git commit -m "Actualizar EPG"
          git push
